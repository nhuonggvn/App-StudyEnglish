<script>
        // Simple haptic feedback simulation
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Dynamic background sparkles for engagement
        const createSparkle = () => {
            const sparkle = document.createElement('div');
            sparkle.className = 'absolute w-1 h-1 bg-secondary-container rounded-full pointer-events-none opacity-0';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            document.body.appendChild(sparkle);
            
            sparkle.animate([
                { opacity: 0, transform: 'scale(0)' },
                { opacity: 0.8, transform: 'scale(1.5)' },
                { opacity: 0, transform: 'scale(0)' }
            ], {
                duration: 2000,
                easing: 'ease-in-out'
            }).onfinish = () => sparkle.remove();
        };

        setInterval(createSparkle, 800);
    </script>
