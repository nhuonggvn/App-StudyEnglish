<script>
        function toggleFlip() {
            const card = document.getElementById('flashcard');
            const actionButtons = document.getElementById('action-buttons');
            const instruction = document.getElementById('instruction');
            
            card.classList.toggle('flipped');
            
            if (card.classList.contains('flipped')) {
                actionButtons.classList.remove('opacity-0', 'pointer-events-none');
                instruction.classList.add('opacity-0');
            } else {
                actionButtons.classList.add('opacity-0', 'pointer-events-none');
                instruction.classList.remove('opacity-0');
            }
        }

        function successEffect() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0', 'scale-110');
                overlay.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            }, 10);
            
            // Basic confetti effect logic could go here
        }

        function hideSuccess() {
            const overlay = document.getElementById('success-overlay');
            overlay.classList.add('opacity-0', 'scale-110');
            overlay.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
            setTimeout(() => {
                overlay.classList.add('hidden');
                nextCard();
            }, 500);
        }

        function nextCard() {
            const card = document.getElementById('flashcard');
            const actionButtons = document.getElementById('action-buttons');
            
            // Flip back first
            card.classList.remove('flipped');
            actionButtons.classList.add('opacity-0', 'pointer-events-none');
            
            // Visual transition for "next card"
            card.style.transform = 'translateX(500px) rotate(20deg)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                card.style.transition = 'none';
                card.style.transform = 'translateX(-500px) rotate(-20deg)';
                
                // Here we would normally change image and text content
                
                setTimeout(() => {
                    card.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease';
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.style.opacity = '1';
                }, 50);
            }, 300);
        }
    </script>
