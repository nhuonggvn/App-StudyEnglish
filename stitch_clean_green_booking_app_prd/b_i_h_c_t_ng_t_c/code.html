<script>
    document.querySelectorAll('.active-press').forEach(button => {
      button.addEventListener('mousedown', () => {
        button.style.transform = 'scale(0.96) translateY(2px)';
      });
      button.addEventListener('mouseup', () => {
        button.style.transform = '';
      });
      button.addEventListener('mouseleave', () => {
        button.style.transform = '';
      });
    });

    const playBtn = document.querySelector('button[shadow-\\[0_6px_0px_\\#5516be\\]]');
    if (playBtn) {
      playBtn.addEventListener('click', () => {
        const h2 = document.querySelector('h2');
        h2.classList.add('scale-110', 'text-primary');
        setTimeout(() => {
          h2.classList.remove('scale-110', 'text-primary');
        }, 300);
      });
    }
